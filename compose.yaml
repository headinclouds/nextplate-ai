services:
  postgres:
    image: postgres:16-alpine
    container_name: foodies-postgres
    environment:
      POSTGRES_DB: foodies
      POSTGRES_USER: foodies
      POSTGRES_PASSWORD: foodies
    ports:
      - '5432:5432'
    volumes:
      - foodies-postgres-data:/var/lib/postgresql/data

volumes:
  foodies-postgres-data:
